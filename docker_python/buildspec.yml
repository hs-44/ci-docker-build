version: 0.2

env:
  variables:
    DOCKER_IMAGE_NAME: "python_webapp_today"

phases:
  install:
    commands:
      - echo "Installing required packages..."
      - apt-get update -y
      - apt-get install -y git dos2unix

  pre_build:
    commands:
      - echo "========================================"
      - echo "CodeBuild Pre-Build"
      - echo "========================================"
      - echo "Repository URL is $CODEBUILD_SOURCE_REPO_URL"
      - echo "Source Version is $CODEBUILD_SOURCE_VERSION"
      - echo "Resolved Source Version is $CODEBUILD_RESOLVED_SOURCE_VERSION"
      - echo "CodeBuild Source Directory is $CODEBUILD_SRC_DIR"
      - echo "AWS Region is $AWS_REGION"
      - echo "Docker Image Name is $DOCKER_IMAGE_NAME"
      - echo "Converting shell script to Linux line endings..."
      - dos2unix "$CODEBUILD_SRC_DIR/docker_python/scripts/build_and_push.sh"
      - chmod +x "$CODEBUILD_SRC_DIR/docker_python/scripts/build_and_push.sh"
      - echo "Checking build_and_push.sh..."
      - ls -la "$CODEBUILD_SRC_DIR/docker_python/scripts/"
      - head -n 5 "$CODEBUILD_SRC_DIR/docker_python/scripts/build_and_push.sh"

  build:
    commands:
      - echo "========================================"
      - echo "Build Phase"
      - echo "========================================"
      - pwd
      - docker --version
      - aws --version
      - echo "Executing build_and_push.sh..."
      - bash "$CODEBUILD_SRC_DIR/docker_python/scripts/build_and_push.sh" "$DOCKER_IMAGE_NAME"

  post_build:
    commands:
      - echo "========================================"
      - echo "Build completed"
      - echo "========================================"
